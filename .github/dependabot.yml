version: 2
updates:
  # The Pages workflow's actions. SSG and passmcp are not here: the build
  # installs SSG by version and checks out passmcp's latest release tag, so
  # both move when those projects release, not when a bot notices.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(actions)"
    groups:
      github-actions:
        patterns:
          - "*"
